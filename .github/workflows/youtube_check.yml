name: YouTube Stream Extraction Check

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (9:00 AM o 10:00 AM en España según el horario)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite activar el test manualmente desde la web de GitHub

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run YouTube extraction test
        run: flutter pub run bin/test_youtube.dart

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DJ Unity: Test de Extracción de YouTube -> ${{ job.status == 'success' && '✅ ÉXITO' || '❌ FALLO' }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "DJ Unity CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            El test diario de extracción de streams de YouTube ha finalizado.
            
            Resultado final: ${{ job.status == 'success' && 'ÉXITO (Los extractores funcionan)' || 'FALLO (Hay un error en la extracción)' }}
            Repositorio: ${{ github.repository }}
            Enlace a la ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
